name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Run every JS action on Node.js 24 ahead of GitHub's forced migration,
  # silencing "Node.js 20 actions are deprecated" runner warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
          - windows-11-arm
        rust: [stable, "1.81"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      # Dev-dependencies (thiserror, trybuild) release versions that need a
      # newer compiler than 1.81; resolve them against `rust-version` with a
      # current Cargo, then build everything with 1.81.
      - name: Resolve dependencies for the MSRV
        if: matrix.rust == '1.81'
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable generate-lockfile
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      # Four feature modes: std (default), everything, core only, core + alloc.
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Clippy (alloc only)
        run: cargo clippy --all-targets --no-default-features --features alloc -- -D warnings
      - name: Test (default features)
        run: cargo test
      - name: Test (all features)
        run: cargo test --all-features
      - name: Test (no default features)
        run: cargo test --no-default-features
      - name: Test (alloc only)
        run: cargo test --no-default-features --features alloc
      - name: Build examples
        run: cargo build --examples
      # Every mode: a doc link to a feature-gated item breaks only when that
      # feature is off.
      - name: Doc (default features)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Doc (all features)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Doc (no default features)
        run: cargo doc --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  ui:
    name: Compile-fail tests (1.99)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The expected compiler output in tests/ui is pinned to this toolchain;
      # refresh it deliberately (TRYBUILD=overwrite) when the pin moves.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - name: Compile-fail tests
        run: cargo test --test ui
        env:
          DEFINE_ERR_UI: "1"

  no-std:
    name: no_std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabihf
          # No compare-and-swap: the reporting facade is compiled out here.
          - thumbv6m-none-eabi
          - riscv32imac-unknown-none-elf
          - wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build (core only)
        run: cargo build --no-default-features --target ${{ matrix.target }}
      - name: Build (core + alloc)
        run: cargo build --no-default-features --features alloc --target ${{ matrix.target }}

  miri:
    name: Miri
    runs-on: ubuntu-latest
    # Isolation is off because tests convert a real `io::Error` from opening a
    # file that does not exist; nothing else touches the host.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Miri (all features)
        run: cargo miri test --all-features
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-disable-isolation"
      - name: Miri (no default features)
        run: cargo miri test --no-default-features
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-disable-isolation"

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package
        run: cargo package

  security:
    name: Security (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Audit
        run: cargo audit
      - name: Deny
        run: cargo deny check
